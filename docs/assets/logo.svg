<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Icon Squircle -->
  <rect width="512" height="512" rx="112" fill="#000000" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#262626" stroke-width="2" />

  <!-- Outer Geometric Letter "C" (Bold & Thick) -->
  <path
    d="M 370 152 A 152 152 0 1 0 370 360"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="58"
    stroke-linecap="round"
  />

  <!-- Central Isometric Storage Chunk Box -->
  <g transform="translate(0, 0)">
    <!-- Top Face -->
    <polygon
      points="256,184 322,222 256,260 190,222"
      fill="#FFFFFF"
      stroke="#000000"
      stroke-width="4.5"
      stroke-linejoin="round"
    />

    <!-- Left Face -->
    <polygon
      points="190,222 256,260 256,336 190,298"
      fill="#E4E4E7"
      stroke="#000000"
      stroke-width="4.5"
      stroke-linejoin="round"
    />

    <!-- Right Face -->
    <polygon
      points="256,260 322,222 322,298 256,336"
      fill="#A1A1AA"
      stroke="#000000"
      stroke-width="4.5"
      stroke-linejoin="round"
    />

    <!-- Box Center Joint Line -->
    <path
      d="M 256,184 L 256,260 L 256,336"
      fill="none"
      stroke="#000000"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Box Top Parcel Tape -->
    <path
      d="M 223,203 L 289,241"
      fill="none"
      stroke="#000000"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>
