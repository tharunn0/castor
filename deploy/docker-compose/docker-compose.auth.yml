services:
  # PostgreSQL Database for Auth Service
  auth-db:
    image: postgres:17-alpine
    container_name: castor-auth-db
    environment:
      - POSTGRES_DB=castor_auth
      - POSTGRES_USER=castor
      - POSTGRES_PASSWORD=castor123
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ../docker/init-auth-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castor -d castor_auth"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - castor-auth-net
    restart: unless-stopped

  # Auth Service
  auth-svc:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.auth
    image: castor-auth-svc:latest
    container_name: castor-auth-svc
    environment:
      # App Environment & Observability
      - APP_ENV=dev
      - LOG_LEVEL=debug # error, info, debug

      # HTTP Server
      - AUTH_HTTP_ADDR=:9095
      - AUTH_READ_TIMEOUT=10s
      - AUTH_WRITE_TIMEOUT=10s
      - AUTH_IDLE_TIMEOUT=120s
      - AUTH_SHUTDOWN_TIMEOUT=10s

      # Database Connection Pool
      - AUTH_DATABASE_URL=postgres://castor:castor123@auth-db:5432/castor_auth?sslmode=disable
      - AUTH_DB_MAX_CONNS=25
      - AUTH_DB_MIN_CONNS=5
      - AUTH_DB_MAX_CONN_LIFETIME=1h
      - AUTH_DB_MAX_CONN_IDLE_TIME=30m
      - AUTH_DB_HEALTH_CHECK_PERIOD=1m
      - AUTH_DB_CONNECT_TIMEOUT=5s

      # Security & Key Management
      - ADMIN_KEY=castor-cluster-admin-secret
      - AUTH_BCRYPT_COST=12
      - AUTH_JWT_SECRET=castor-auth-jwt-super-secret-key-change-in-production
      - AUTH_JWT_EXPIRY=24h
    ports:
      - "9095:9095"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - castor-auth-net
    restart: unless-stopped

volumes:
  auth-db-data:

networks:
  castor-auth-net:
    driver: bridge
