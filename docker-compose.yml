services:
  # Metadata Consensus Cluster (3 Nodes)
  metadata-1:
    build:
      context: .
      target: metadata-svc
    image: castor-metadata-svc:latest
    container_name: castor-metadata-1
    environment:
      - NODE_ID=metadata-1
      - GRPC_ADDR=:9090
      - RAFT_ADDR=metadata-1:9091
      - DATA_DIR=/data
      - RAFT_BOOTSTRAP=true
      - RAFT_PEERS=metadata-1=metadata-1:9091,metadata-2=metadata-2:9091,metadata-3=metadata-3:9091
    ports:
      - "9090:9090"
      - "9091:9091"
    volumes:
      - metadata-1-data:/data
    networks:
      - castor-net
    restart: unless-stopped

  metadata-2:
    build:
      context: .
      target: metadata-svc
    image: castor-metadata-svc:latest
    container_name: castor-metadata-2
    environment:
      - NODE_ID=metadata-2
      - GRPC_ADDR=:9090
      - RAFT_ADDR=metadata-2:9091
      - DATA_DIR=/data
      - RAFT_BOOTSTRAP=false
      - RAFT_PEERS=metadata-1=metadata-1:9091,metadata-2=metadata-2:9091,metadata-3=metadata-3:9091
    ports:
      - "9092:9090"
    volumes:
      - metadata-2-data:/data
    networks:
      - castor-net
    depends_on:
      - metadata-1
    restart: unless-stopped

  metadata-3:
    build:
      context: .
      target: metadata-svc
    image: castor-metadata-svc:latest
    container_name: castor-metadata-3
    environment:
      - NODE_ID=metadata-3
      - GRPC_ADDR=:9090
      - RAFT_ADDR=metadata-3:9091
      - DATA_DIR=/data
      - RAFT_BOOTSTRAP=false
      - RAFT_PEERS=metadata-1=metadata-1:9091,metadata-2=metadata-2:9091,metadata-3=metadata-3:9091
    ports:
      - "9094:9090"
    volumes:
      - metadata-3-data:/data
    networks:
      - castor-net
    depends_on:
      - metadata-1
    restart: unless-stopped

  # Storage Data Nodes (3 Nodes)
  data-1:
    build:
      context: .
      target: data-svc
    image: castor-data-svc:latest
    container_name: castor-data-1
    environment:
      - NODE_ID=data-1
      - GRPC_ADDR=:9101
      - DATA_DIR=/data
    ports:
      - "9101:9101"
    volumes:
      - data-1-data:/data
    networks:
      - castor-net
    restart: unless-stopped

  data-2:
    build:
      context: .
      target: data-svc
    image: castor-data-svc:latest
    container_name: castor-data-2
    environment:
      - NODE_ID=data-2
      - GRPC_ADDR=:9101
      - DATA_DIR=/data
    ports:
      - "9102:9101"
    volumes:
      - data-2-data:/data
    networks:
      - castor-net
    restart: unless-stopped

  data-3:
    build:
      context: .
      target: data-svc
    image: castor-data-svc:latest
    container_name: castor-data-3
    environment:
      - NODE_ID=data-3
      - GRPC_ADDR=:9101
      - DATA_DIR=/data
    ports:
      - "9103:9101"
    volumes:
      - data-3-data:/data
    networks:
      - castor-net
    restart: unless-stopped

  # S3 API Gateway
  gateway:
    build:
      context: .
      target: gateway-svc
    image: castor-gateway-svc:latest
    container_name: castor-gateway
    environment:
      - S3_ADDR=:9000
      - CONSOLE_ADDR=:9001
      - METADATA_ADDR=metadata-1:9090
      - DATA_NODES=data-1:9101,data-2:9101,data-3:9101
      - METADATA_NODES=metadata-1:9090,metadata-2:9090,metadata-3:9090
      - ROOT_ACCESS_KEY_ID=admin
      - ROOT_SECRET_ACCESS_KEY=admin123
      - WRITE_QUORUM=2
      - CHUNK_SIZE=4194304
      - MAX_CONCURRENT_UPLOADS=64
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - castor-net
    depends_on:
      - metadata-1
      - data-1
      - data-2
      - data-3
    restart: unless-stopped

volumes:
  metadata-1-data:
  metadata-2-data:
  metadata-3-data:
  data-1-data:
  data-2-data:
  data-3-data:

networks:
  castor-net:
    driver: bridge
